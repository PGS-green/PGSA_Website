name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck and build. The previous workflow also ran `npm test`, which
      # belonged to the old root app removed in this change; the new frontend
      # has no suite yet, so asserting one would just fail every push.
      - run: npx tsc -b --noEmit
      - run: npm run build
